name: Deploy frontend a producción

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
  VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
  VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}

jobs:
  build-and-deploy:
    name: Construir y publicar SPA
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validar configuración de despliegue
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          for name in VITE_AUTH0_DOMAIN VITE_AUTH0_CLIENT_ID VITE_AUTH0_AUDIENCE S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!name}" ]; then
              echo "Falta configurar la variable de repositorio $name" >&2
              exit 1
            fi
          done

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar lint
        run: npm run lint

      - name: Construir frontend
        run: npm run build

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Assets con hash primero; el HTML se publica después y sin caché.
      - name: Publicar assets en S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: >-
          aws s3 sync dist/ "s3://${S3_BUCKET}/"
          --delete
          --exclude index.html
          --cache-control "public,max-age=31536000,immutable"

      - name: Publicar HTML sin caché
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: >-
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html"
          --cache-control "no-cache,no-store,must-revalidate"
          --content-type "text/html; charset=utf-8"

      - name: Invalidar entrada SPA en CloudFront
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID"
          --paths "/" "/index.html"
